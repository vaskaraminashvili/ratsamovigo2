<!doctype html>
<html lang="ka">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#120F17">
    <title>ოფლაინ – რა წამოვიღო?</title>
    <style>
        :root { color-scheme: dark light; --bg: #120f17; --fg: #f1ecf3; --muted: #aba2b5; --accent: #f6c744; }
        @media (prefers-color-scheme: light) { :root { --bg: #f5f3f8; --fg: #1a1621; --muted: #6c6278; --accent: #8a5a00; } }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 1.5rem; background: var(--bg); color: var(--fg); font-family: 'Noto Sans Georgian', 'Bricolage Grotesque', system-ui, sans-serif; }
        main { max-width: 22rem; }
        h1 { font-size: 2rem; line-height: 1.15; margin: 0 0 .75rem; font-weight: 800; }
        p { color: var(--muted); margin: 0 0 2rem; line-height: 1.5; }
        button { width: 100%; min-height: 3rem; border: 0; border-radius: 999px; background: var(--accent); color: #120f17; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <main>
        <h1>ინტერნეტი არ გაქვს</h1>
        <p>ეს გვერდი ჯერ არ არის შენახული. როცა კავშირი დაბრუნდება, სიები ისევ განახლდება.</p>
        <button type="button" onclick="location.reload()">თავიდან ცდა</button>
    </main>
</body>
</html>
